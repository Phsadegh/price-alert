name: Price Alert

on:
  workflow_dispatch:
  schedule:
    # 01:00 New York, Mon-Fri, DST-proof (GitHub cron is UTC-only):
    #   EDT (Mar-Nov): 05:00 UTC = 01:00 NY -> monitor starts
    #                  06:00 UTC = 02:00 NY -> launch gate exits in ~1 min
    #   EST (Nov-Mar): 05:00 UTC = 00:00 NY -> launch gate exits in ~1 min
    #                  06:00 UTC = 01:00 NY -> monitor starts
    - cron: "0 5 * * 1-5"
    - cron: "0 6 * * 1-5"

concurrency:
  group: price-monitor        # never two monitors at once (no duplicate alerts)

jobs:
  price-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests matplotlib

      - name: Run SRFVG monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_alert.py

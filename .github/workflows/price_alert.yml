name: Price Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "3 5 * * 1-5"    # 01:03 New York, EDT season (Mar–Nov)
    - cron: "3 6 * * 1-5"    # 01:03 New York, EST season (Nov–Mar)

concurrency:
  group: price-monitor        # never two monitors at once (no duplicate alerts)

jobs:
  price-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests matplotlib

      - name: Run SRFVG monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_alert.py

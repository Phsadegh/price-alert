name: Price Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "50 3-21/6 * * *"    # 03:50 / 09:50 / 15:50 / 21:50 UTC (6h restart)

concurrency:
  group: price-monitor
  cancel-in-progress: true

jobs:
  price-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests matplotlib

      - name: Run SRFVG monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_alert.py

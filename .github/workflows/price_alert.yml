name: Price Alert

on:
  workflow_dispatch:
  # Restart every 6h (GitHub's job limit). 03:50 UTC = 23:50 EDT / 22:50 EST,
  # always just BEFORE midnight New York -> clean day reset; the handover
  # candle it may lose is pre-midnight and therefore irrelevant.
  schedule:
    - cron: "50 3-21/6 * * *"    # 03:50 / 09:50 / 15:50 / 21:50 UTC

concurrency:
  group: price-monitor
  cancel-in-progress: true

permissions:
  contents: write               # lets the script commit state.json

jobs:
  price-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"           # cached wheels -> fast startup

      - name: Install dependencies
        run: pip install --quiet --no-input -r requirements.txt

      - name: Run SRFVG monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python price_alert.py
